name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: 
          - auth-service
          - businesses-service
          - order-service
          - product-service
          - roles-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install dependencies (${{ matrix.service }})
        run: npm ci
        working-directory: Back-end/${{ matrix.service }}

      - name: Build service (${{ matrix.service }})
        run: npm run build
        working-directory: Back-end/${{ matrix.service }}